name: Release checks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only: releases are published from a developer machine, not from CI.
#
# Distribution builds are signed with a Developer ID and notarized by Apple,
# which needs the signing certificate and the notarytool keychain profile.
# Neither exists on a GitHub runner, so CI verifies the tag and leaves
# publishing to `Scripts/make_release.sh`, which signs, notarizes and staples.
# This job must never upload an artifact, or it would replace a notarized
# build with an ad-hoc one.
permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build and package
        env:
          APP_NAME: PromptBar
          BUNDLE_ID: com.promptbar.app
          MENU_BAR_APP: "1"
          SIGNING_MODE: adhoc
          ARCHES: arm64
        run: |
          Scripts/package_app.sh release
          test -x PromptBar.app/Contents/MacOS/PromptBar
          test -f PromptBar.app/Contents/Resources/Icon.icns

      - name: Check the tag matches version.env
        run: |
          source version.env
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ] && [ "$TAG" != "$MARKETING_VERSION" ]; then
            echo "::error::Tag v$TAG does not match MARKETING_VERSION=$MARKETING_VERSION"
            exit 1
          fi
